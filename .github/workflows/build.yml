name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  REVIT_CONFIG: Release R26
  ADDIN_OUTPUT: plugin/bin/AddIn 2026 Release R26

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional Authenticode signing (D4). Leave the secrets unset to skip.
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Directory.Build.props turns on Deterministic + ContinuousIntegrationBuild
      # when GITHUB_ACTIONS=true, so these are the same commands as a local build.
      - name: Build plugin
        run: dotnet build plugin -c "${{ env.REVIT_CONFIG }}"

      - name: Build command set
        run: dotnet build commandset -c "${{ env.REVIT_CONFIG }}"

      - name: Assembly hashes (deterministic build check, compare across runs)
        shell: pwsh
        run: |
          $addinDir = Join-Path $env:ADDIN_OUTPUT "revit-bridge"
          Get-FileHash -Algorithm SHA256 -Path @(
            (Join-Path $addinDir "RevitMCPPlugin.dll"),
            (Join-Path $addinDir "Commands\RevitMCPCommandSet\2026\RevitMCPCommandSet.dll")
          ) | Format-Table Hash, @{ n = 'File'; e = { Split-Path $_.Path -Leaf } } -AutoSize

      - name: Sign assemblies (only when a signing certificate is configured)
        if: env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $addinDir = Join-Path $env:ADDIN_OUTPUT "revit-bridge"
          $targets = @(
            (Join-Path $addinDir "RevitMCPPlugin.dll"),
            (Join-Path $addinDir "Commands\RevitMCPCommandSet\2026\RevitMCPCommandSet.dll")
          )
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGNING_PFX_PASSWORD @targets
          Remove-Item $pfx -Force

      - name: Package
        id: package
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "dev-" + "${{ github.sha }}".Substring(0, 7)
          }
          $zipName = "revit-bridge-addin-$version.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$env:ADDIN_OUTPUT/*" -DestinationPath "dist/$zipName" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii -NoNewline
          "zip_name=$zipName" | Add-Content -Path $env:GITHUB_OUTPUT
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
